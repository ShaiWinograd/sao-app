name: Init Geocoding Selection Secret (production)

# Manually triggered, WRITE-LIMITED production workflow that INITIALIZES exactly one
# App Setting — GEOCODE_SELECTION_SECRET — on the API app, and ONLY when it is absent
# or shorter than 32 bytes. It never rotates an already-valid secret, never prints any
# setting value / encoded form / exact length, and fails closed. It does NOT modify
# AZURE_MAPS_KEY or ADDRESS_GEOCODING_ENABLED and calls no geocoding endpoint (only
# GET /health).
#
# ── Threat / logging safety ─────────────────────────────────────────────────────
#   1. The generated secret is registered with `::add-mask::` IMMEDIATELY after
#      generation and before any use, so any accidental echo is masked by the runner.
#   2. Every `az appsettings list/set` invocation redirects BOTH stdout and stderr to
#      PRIVATE mktemp files (mode 600, under `mktemp -d`) — az stdout can contain ALL
#      setting values, so it is never sent to the log. Those files are securely
#      deleted (overwrite/shred + unlink) via a cleanup trap and inline after use.
#   3. Length checks are computed from a temp file with `wc -c`; the value bytes are
#      written by `jq -j` into a private temp file, counted, and shredded — the value
#      and its exact length are never printed.
#   4. Only sanitized boolean/status lines and fixed error messages are emitted.
#   5. `set -x` (xtrace) is deliberately NOT enabled.
#   6. permissions: {} ; no checkout ; no artifacts ; nothing written to
#      $GITHUB_ENV / $GITHUB_OUTPUT ; azure/login@v2 masks AZURE_CREDENTIALS.

on:
  workflow_dispatch: {}

# No GITHUB_TOKEN scopes are needed: no checkout, no GitHub API. Azure auth uses the
# production environment's AZURE_CREDENTIALS secret.
permissions: {}

env:
  AZURE_RESOURCE_GROUP: workforce-rg
  AZURE_API_APP_NAME: spaceorder-api-app-poc
  SETTING_NAME: GEOCODE_SELECTION_SECRET
  API_HEALTH_URL: https://spaceorder-api-app-poc-h7hef6a2gtd5euhq.israelcentral-01.azurewebsites.net/health
  MIN_BYTES: '32'
  RANDOM_BYTES: '48'
  HEALTH_TIMEOUT_SECONDS: '240'
  HEALTH_INTERVAL_SECONDS: '10'

jobs:
  init-selection-secret:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Azure credentials are configured
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::AZURE_CREDENTIALS is not configured in the production environment."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize GEOCODE_SELECTION_SECRET (idempotent, fail-closed)
        run: |
          set -euo pipefail
          # NOTE: `set -x` is intentionally NOT enabled — see the threat/logging note above.

          RG="$AZURE_RESOURCE_GROUP"; APP="$AZURE_API_APP_NAME"; NAME="$SETTING_NAME"; MIN="$MIN_BYTES"

          # --- private temp workspace + secure cleanup ---
          WORK="$(mktemp -d)"
          secure_rm() {
            for f in "$@"; do
              [ -f "$f" ] || continue
              if command -v shred >/dev/null 2>&1; then shred -u "$f" 2>/dev/null || rm -f "$f"; else : > "$f"; rm -f "$f"; fi
            done
          }
          cleanup() { [ -d "$WORK" ] && { find "$WORK" -type f -exec sh -c 'command -v shred >/dev/null 2>&1 && shred -u "$1" 2>/dev/null || rm -f "$1"' _ {} \; 2>/dev/null; rm -rf "$WORK"; }; }
          trap cleanup EXIT

          # Read only THIS setting's value length, without printing it. az stdout/stderr
          # go to private temp files; the value is materialized by `jq -j` and counted.
          read_len() {
            # $1 = output var name (via echo), reads current stored length in bytes
            local js="$WORK/az.json" er="$WORK/az.err" val="$WORK/val.bin"
            if az webapp config appsettings list --resource-group "$RG" --name "$APP" \
                 --query "[?name=='$NAME'].value | [0]" --output json >"$js" 2>"$er"; then
              jq -j '. // ""' <"$js" >"$val"
              local n; n="$(wc -c <"$val" | tr -d ' ')"
              secure_rm "$js" "$er" "$val"
              printf '%s' "$n"
              return 0
            else
              local rc=$?; secure_rm "$js" "$er" "$val"
              return "$rc"
            fi
          }

          # --- 1) inspect current value (fail closed if unreadable) ---
          if ! CUR_LEN="$(read_len)"; then
            echo "::error::Failed to inspect the current App Setting on '$APP' in '$RG'."
            exit 1
          fi

          # --- 2) already valid? do NOT rotate ---
          if [ "$CUR_LEN" -ge "$MIN" ]; then
            echo "already_valid=true"
            echo "initialized=false"
            echo "::notice::GEOCODE_SELECTION_SECRET already satisfies the >= ${MIN}-byte requirement; no change made (not rotated)."
            exit 0
          fi
          echo "already_valid=false"

          # --- 3) generate a dedicated CSPRNG secret (>= 48 random bytes, hex-encoded) ---
          if ! SECRET="$(openssl rand -hex "$RANDOM_BYTES")"; then
            echo "::error::Secret generation failed."
            exit 1
          fi
          if [ -z "$SECRET" ]; then echo "::error::Generated secret is empty."; exit 1; fi
          # Mask BEFORE any use.
          echo "::add-mask::$SECRET"

          # --- 4) set ONLY this setting; suppress + delete az output (may contain all values) ---
          SET_OUT="$WORK/set.out"; SET_ERR="$WORK/set.err"
          if az webapp config appsettings set --resource-group "$RG" --name "$APP" \
               --settings "${NAME}=${SECRET}" >"$SET_OUT" 2>"$SET_ERR"; then
            secure_rm "$SET_OUT" "$SET_ERR"
          else
            AZ_RC=$?; secure_rm "$SET_OUT" "$SET_ERR"
            echo "::error::Failed to set ${NAME} on '$APP' in '$RG' (az CLI exit status ${AZ_RC})."
            exit 1
          fi
          unset SECRET
          echo "initialized=true"

          # --- 5) verify stored value is >= MIN bytes, without printing it ---
          if ! VER_LEN="$(read_len)"; then
            echo "::error::Failed to verify ${NAME} after the write."
            exit 1
          fi
          if [ "$VER_LEN" -ge "$MIN" ]; then
            echo "verified_min_bytes=true"
          else
            echo "verified_min_bytes=false"
            echo "::error::Post-write verification failed: stored ${NAME} is shorter than ${MIN} bytes."
            exit 1
          fi

          # --- 6) wait for the API restart; verify GET /health == 200 within a bounded timeout ---
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          health_ok=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API_HEALTH_URL" || echo 000)"
            if [ "$code" = "200" ]; then health_ok=true; break; fi
            sleep "$HEALTH_INTERVAL_SECONDS"
          done
          if [ "$health_ok" = true ]; then
            echo "health_200=true"
          else
            echo "health_200=false"
            echo "::error::API /health did not return 200 within ${HEALTH_TIMEOUT_SECONDS}s after the configuration change."
            exit 1
          fi

          echo "GEOCODE_SELECTION_SECRET initialization complete."
